<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>CaseUp</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
}

body{
    background:
    radial-gradient(circle at top,#17335c,#050914 60%);
    color:white;
    min-height:100vh;
    padding-bottom:80px;
}


.header{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px;

    background:#0a1224;
    border-bottom:1px solid #243354;
}


.logo{
    font-size:26px;
    font-weight:900;
    color:#ffd700;
    text-shadow:0 0 15px #ffd700;
}


.balance{

    background:#121d35;
    border:1px solid #806900;

    border-radius:25px;

    padding:10px 18px;

    color:#ffd700;

    font-weight:900;

}





.page{
    display:none;
    padding:15px;
}


.page.active{
    display:block;
}




.banner{

    height:180px;

    border-radius:25px;

    padding:20px;

    overflow:hidden;

    position:relative;


    background:
    linear-gradient(135deg,#173c72,#10182d);


    border:1px solid #2358a0;

    margin-bottom:20px;

}



.banner h1{

    font-size:28px;

    position:relative;

    z-index:2;

}



.banner p{

    color:#b7c7e5;

    margin-top:10px;

}


.banner button{

    margin-top:25px;

    padding:12px 25px;

    border:0;

    border-radius:15px;

    background:
    linear-gradient(135deg,#ffd700,#ff9d00);

    font-weight:900;

}





.title{

    font-size:24px;

    font-weight:900;

    margin:20px 0;

}





.grid{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:14px;

}





.case{

    height:250px;

    border-radius:25px;

    padding:15px;

    text-align:center;

    background:

    linear-gradient(160deg,#172544,#0c1427);


    border:1px solid rgba(255,255,255,.08);


    box-shadow:
    0 10px 30px rgba(0,0,0,.4);

}



.case-image{

    height:120px;

    display:flex;

    align-items:center;

    justify-content:center;


}



.box{

    width:80px;

    height:80px;

    border-radius:20px;

    transform:rotate(5deg);


    background:
    linear-gradient(135deg,#ffd700,#ff9100);


    box-shadow:

    0 0 35px #ffb000;

}



.case:nth-child(3n) .box{

    background:
    linear-gradient(135deg,#00bfff,#005eff);

    box-shadow:
    0 0 35px #008cff;

}



.case:nth-child(4n) .box{

    background:
    linear-gradient(135deg,#c15cff,#6b00ff);

    box-shadow:
    0 0 35px #9b00ff;

}




.case-name{

    font-size:16px;

    font-weight:900;

}



.price{

    color:#ffd700;

    font-weight:900;

    margin:8px;

}



.open{

    width:100%;

    padding:12px;

    border:0;

    border-radius:14px;


    background:
    linear-gradient(135deg,#ffd700,#ffae00);


    font-weight:900;

}





.nav{

    position:fixed;

    bottom:0;

    left:0;

    right:0;


    height:75px;


    background:#090f20;


    display:flex;

    justify-content:space-around;

    align-items:center;


    border-top:1px solid #243354;


}


.nav button{

    background:none;

    border:0;

    color:#71809c;

    font-size:12px;

    font-weight:bold;

}


.nav .active{

    color:#ffd700;

}


</style><body>


<div class="header">

<div class="logo">
CASEUP
</div>


<div class="balance">
⭐ <span id="balance">6182</span>
</div>

</div>





<section id="casesPage" class="page active">


<div class="banner">


<h1>
🔥 Лучшие кейсы
</h1>


<p>
Открывай кейсы и получай редкие подарки
</p>


<button onclick="openCase(15)">
VIP CASE ⭐10000
</button>


</div>



<div class="title">
🎁 Все кейсы
</div>



<div class="grid" id="caseList"></div>


</section>








<section id="gamesPage" class="page">


<div class="title">
🎮 Игры
</div>


<div class="grid">


<div class="case">

<div class="case-image">
<div class="box"></div>
</div>

<div class="case-name">
🎡 Колесо
</div>


<div class="price">
Умножай звезды
</div>


<button class="open"
onclick="wheel()">
Играть
</button>

</div>





<div class="case">

<div class="case-image">
<div class="box"></div>
</div>

<div class="case-name">
💣 Mines
</div>


<div class="price">
Найди подарок
</div>


<button class="open"
onclick="mines()">
Играть
</button>

</div>



<div class="case">

<div class="case-image">
<div class="box"></div>
</div>

<div class="case-name">
🚀 Crash
</div>


<div class="price">
x1-x50
</div>


<button class="open"
onclick="crash()">
Играть
</button>

</div>


</div>


</section>










<section id="inventoryPage" class="page">


<div class="title">
🎒 Инвентарь
</div>


<div class="grid" id="inventory">

</div>


</section>










<section id="profilePage" class="page">


<div class="banner">


<h1>
👤 Профиль
</h1>


<p>
Открыто кейсов:
<span id="opened">0</span>
</p>


<p>
Предметов:
<span id="items">0</span>
</p>


</div>


</section>









<div class="nav">


<button class="active"
onclick="showPage('casesPage',this)">
🎁
<br>
Кейсы
</button>


<button
onclick="showPage('gamesPage',this)">
🎮
<br>
Игры
</button>


<button
onclick="showPage('inventoryPage',this)">
🎒
<br>
Инвентарь
</button>


<button
onclick="showPage('profilePage',this)">
👤
<br>
Профиль
</button>


</div>








<div id="modal"
style="
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
z-index:999;
align-items:center;
justify-content:center;
">


<div style="
background:#111b32;
width:90%;
border-radius:30px;
padding:25px;
text-align:center;
border:1px solid #ffd700;
">


<h2>
Возможный приз
</h2>


<div id="gift"
style="
font-size:90px;
margin:30px;
">
🎁
</div>



<h2 id="win">

</h2>


<p id="rare">

</p>



<button class="open"
onclick="takeGift()">

Забрать

</button>


</div>


</div>









<script>


let balance = 6182;


let opened = 0;


let currentGift=null;



let inventory =
JSON.parse(
localStorage.getItem("caseup")
)
||
[];





const cases = [


{
name:"Star Case",
price:50,
color:"gold"
},


{
name:"Moon Case",
price:100,
color:"blue"
},


{
name:"Sun Case",
price:150,
color:"gold"
},


{
name:"Neon Case",
price:200,
color:"blue"
},


{
name:"Gold Case",
price:300,
color:"gold"
},


{
name:"Diamond Case",
price:500,
color:"blue"
},


{
name:"Ruby Case",
price:750,
color:"red"
},


{
name:"Sapphire Case",
price:1000,
color:"blue"
},


{
name:"Emerald Case",
price:1250,
color:"green"
},


{
name:"Cyber Case",
price:1500,
color:"purple"
},


{
name:"Matrix Case",
price:2000,
color:"purple"
},


{
name:"Galaxy Case",
price:2500,
color:"blue"
},


{
name:"Royal Case",
price:3000,
color:"gold"
},


{
name:"Titan Case",
price:4000,
color:"blue"
},


{
name:"God Case",
price:5000,
color:"gold"
},


{
name:"VIP Case",
price:10000,
color:"purple"
}


];






const gifts=[


{
name:"Diamond NFT",
icon:"💎",
rare:"Epic"
},


{
name:"Golden Star",
icon:"⭐",
rare:"Rare"
},


{
name:"Premium Gift",
icon:"🎁",
rare:"Legendary"
},


{
name:"Crown",
icon:"👑",
rare:"Mythic"
},


{
name:"Rocket",
icon:"🚀",
rare:"Legendary"
}


];




const list=document.getElementById("caseList");



cases.forEach((c,i)=>{


list.innerHTML+=`

<div class="case">


<div class="case-image">

<div class="box"></div>

</div>


<div class="case-name">

${c.name}

</div>


<div class="price">

⭐ ${c.price}

</div>


<button class="open"
onclick="openCase(${i})">

Открыть

</button>


</div>

`;



});
// ==============================
// НАВИГАЦИЯ
// ==============================


function showPage(id,button){


document
.querySelectorAll(".page")
.forEach(
p=>p.classList.remove("active")
);



document
.getElementById(id)
.classList.add("active");



document
.querySelectorAll(".nav button")
.forEach(
b=>b.classList.remove("active")
);



button.classList.add("active");


}







// ==============================
// ОТКРЫТИЕ КЕЙСА
// ==============================


function openCase(id){


let box=cases[id];



if(balance < box.price){

alert(
"Недостаточно ⭐"
);

return;

}



balance-=box.price;


document
.getElementById("balance")
.innerText=balance;



opened++;


document
.getElementById("opened")
.innerText=opened;



document
.getElementById("modal")
.style.display="flex";



let gift=
document.getElementById("gift");


let win=
document.getElementById("win");


let rare=
document.getElementById("rare");



gift.innerHTML="🎲";

win.innerHTML="Открываем...";

rare.innerHTML="";




let count=0;


let roll=setInterval(()=>{


let temp=
gifts[
Math.floor(
Math.random()*gifts.length
)
];


gift.innerHTML=temp.icon;


count++;



if(count>20){


clearInterval(roll);



currentGift=
getRandomGift();



gift.innerHTML=
currentGift.icon;


win.innerHTML=
currentGift.name;


rare.innerHTML=
currentGift.rare;



}



},100);



}






// ==============================
// ШАНСЫ ПРИЗОВ
// ==============================


function getRandomGift(){


let r=Math.random();



if(r<0.55){

return gifts[0];

}



if(r<0.80){

return gifts[1];

}



if(r<0.93){

return gifts[2];

}



if(r<0.98){

return gifts[4];

}



return gifts[3];


}









// ==============================
// ЗАБРАТЬ ПРЕДМЕТ
// ==============================


function takeGift(){



if(!currentGift)
return;



inventory.push({

name:
currentGift.name,

icon:
currentGift.icon,

rare:
currentGift.rare


});




localStorage.setItem(

"caseup",

JSON.stringify(inventory)

);



renderInventory();



document
.getElementById("modal")
.style.display="none";



}









// ==============================
// ОТОБРАЖЕНИЕ ИНВЕНТАРЯ
// ==============================


function renderInventory(){



let box=
document.getElementById("inventory");



box.innerHTML="";




if(inventory.length===0){


box.innerHTML=`

<div style="
grid-column:1/3;
text-align:center;
padding:40px;
color:#8793ad">

Пока пусто 🎁

</div>

`;

return;


}






inventory.forEach(item=>{


box.innerHTML+=`


<div class="case">


<div class="case-image">

<div class="box"></div>

</div>



<div class="case-name">

${item.icon}
${item.name}

</div>



<div class="price">

${item.rare}

</div>



</div>


`;


});



document
.getElementById("items")
.innerText=
inventory.length;



}




renderInventory();








// ==============================
// МИНИ ИГРЫ
// ==============================



function wheel(){


let prize=
Math.floor(
Math.random()*300
)+50;



balance+=prize;


document
.getElementById("balance")
.innerText=balance;



alert(
"🎡 Вы выиграли ⭐"+prize
);


}





function mines(){


let result=
Math.random();



if(result>0.45){



balance+=250;



alert(
"💎 Найден подарок ⭐250"
);



}

else{


alert(
"💣 Мина! Попробуй ещё"
);


}



document
.getElementById("balance")
.innerText=balance;



}






function crash(){


let multi=
(
Math.random()*10+1
)
.toFixed(2);



let prize=
Math.floor(
100*multi
);



balance+=prize;


document
.getElementById("balance")
.innerText=balance;



alert(
"🚀 x"+multi+
"\n⭐ +"+prize
);


}







// ==============================
// TELEGRAM
// ==============================


if(window.Telegram){


Telegram.WebApp.ready();


Telegram.WebApp.expand();


}<script>


// ==============================
// СОХРАНЕНИЕ БАЛАНСА
// ==============================


setInterval(()=>{


localStorage.setItem(
"caseup_balance",
balance
);


},1000);





// загрузка баланса


let savedBalance =
localStorage.getItem(
"caseup_balance"
);



if(savedBalance){


balance=
Number(savedBalance);



document
.getElementById("balance")
.innerText=
balance;


}






// ==============================
// TELEGRAM ТЕМА
// ==============================


if(window.Telegram){


let tg=
Telegram.WebApp;


tg.ready();


tg.expand();


}






</script>


</body>

</html>
