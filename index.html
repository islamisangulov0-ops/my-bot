<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CaseUp</title>
    <style>
        :root {
            --bg: #0f1218;
            --card: #1a1d24;
            --accent: #ffd700;
            --blue: #00c8ff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: #fff; padding-bottom: 70px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(26,29,36,0.95); border-bottom: 1px solid #2a2e38; position: sticky; top: 0; z-index: 10; }
        .logo { font-weight: 900; font-size: 20px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
        .balance { background: #2a2e38; padding: 5px 12px; border-radius: 15px; font-size: 15px; color: var(--accent); font-weight: bold; border: 1px solid rgba(255,215,0,0.3); }
        .container { padding: 20px; }
        h1 { font-size: 22px; margin-bottom: 15px; color: var(--accent); text-transform: uppercase; text-align: center; font-weight: 800; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .card { background: var(--card); border-radius: 14px; padding: 15px; text-align: center; border: 1px solid #2a2e38; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; }
        .card:active { transform: scale(0.97); }
        .icon { font-size: 45px; margin: 10px 0; }
        .name { font-weight: 700; font-size: 15px; margin-bottom: 5px; }
        .price { font-size: 14px; color: var(--accent); margin-bottom: 12px; font-weight: 800; }
        .btn { background: linear-gradient(135deg, #ffd700, #ffc300); color: #000; border: none; padding: 10px; border-radius: 8px; font-weight: 900; width: 100%; cursor: pointer; text-transform: uppercase; font-size: 13px; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 100; flex-direction: column; padding: 20px; }
        .modal { background: var(--card); border-radius: 16px; padding: 25px; text-align: center; border: 2px solid var(--accent); width: 100%; max-width: 320px; display: none; flex-direction: column; align-items: center; }
        .collect { background: linear-gradient(135deg, var(--blue), #0099ff); color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 900; width: 100%; cursor: pointer; margin-top: 15px; text-transform: uppercase; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<header>
    <div class="logo">CaseUp</div>
    <div class="balance">⭐ <span id="bal">15450</span></div>
</header>

<div class="container">
    <h1>Кейсы</h1>
    <div class="grid">
        <div class="card" onclick="openCase('STAR CASE', 100)">
            <div class="icon">🎁</div>
            <div class="name">Star Case</div>
            <div class="price">⭐ 100</div>
            <button class="btn">Открыть</button>
        </div>
        <div class="card" onclick="openCase('NFT CROWN', 500)">
            <div class="icon">👑</div>
            <div class="name">NFT Crown</div>
            <div class="price">⭐ 500</div>
            <button class="btn">Открыть</button>
        </div>
    </div>
</div>

<div class="overlay" id="loader">
    <div style="font-size: 50px; animation: spin 1s infinite linear;">🌀</div>
    <div style="color: var(--accent); margin-top: 15px; font-weight: bold;">Открываем...</div>
</div>

<div class="overlay" id="dropOverlay">
    <div class="modal" id="modal">
        <h3 style="color: var(--accent); margin-bottom: 10px; font-size: 18px;">ВЫИГРЫШ!</h3>
        <div id="dropIcon" style="font-size: 60px; margin: 10px 0;">💎</div>
        <div id="dropName" style="font-size: 18px; font-weight: bold; margin-bottom: 5px;"></div>
        <div id="dropRarity" style="color: var(--blue); font-size: 13px; margin-bottom: 15px; text-transform: uppercase; font-weight: bold;"></div>
        <button class="collect" onclick="closeDrop()">Забрать</button>
    </div>
</div>

<script>
    let balance = 15450;
    const items = [
        { name: 'Diamond Ring', rarity: 'Legendary NFT', icon: '💍' },
        { name: 'Gold Crown', rarity: 'Epic NFT', icon: '👑' },
        { name: 'Golden Star', rarity: 'Rare Token', icon: '⭐' },
        { name: 'Teddy Bear', rarity: 'Common Gift', icon: '🧸' }
    ];

    function openCase(name, price) {
        if (balance < price) { alert('Мало звезд!'); return; }
        balance -= price;
        document.getElementById('bal').innerText = balance;
        
        document.getElementById('loader').style.display = 'flex';

        setTimeout(() => {
            document.getElementById('loader').style.display = 'none';
            let win = items[Math.floor(Math.random() * items.length)];
            
            document.getElementById('dropIcon').innerText = win.icon;
            document.getElementById('dropName').innerText = win.name;
            document.getElementById('dropRarity').innerText = win.rarity;

            document.getElementById('dropOverlay').style.display = 'flex';
            document.getElementById('modal').style.display = 'flex';
        }, 1200);
    }

    function closeDrop() {
        document.getElementById('dropOverlay').style.display = 'none';
        document.getElementById('modal').style.display = 'none';
    }
</script>
</body>
</html>
