<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>CaseUp</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

:root{
--bg:#050914;
--card:#111827;
--card2:#172033;
--gold:#ffd700;
--blue:#00a8ff;
--purple:#8b5cf6;
--text:#fff;
--gray:#8892a6;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:
Inter,
Arial,
sans-serif;
}

body{
background:
radial-gradient(circle at top,#102040,#050914 40%);
color:white;
min-height:100vh;
padding-bottom:80px;
}


/* HEADER */

header{

height:65px;
display:flex;
align-items:center;
justify-content:space-between;

padding:0 18px;

background:
rgba(10,15,30,.85);

backdrop-filter:blur(15px);

border-bottom:
1px solid rgba(255,255,255,.08);

position:sticky;
top:0;
z-index:20;

}


.logo{

font-size:22px;
font-weight:900;

color:var(--gold);

text-shadow:
0 0 15px #ffd700;

}


.balance{

background:
linear-gradient(135deg,#1d273c,#111827);

border:
1px solid rgba(255,215,0,.3);

padding:
9px 15px;

border-radius:20px;

font-weight:900;

color:var(--gold);

}


/* PAGES */

.page{

display:none;

padding:18px;

animation:
fade .3s;

}


.page.active{

display:block;

}


@keyframes fade{

from{
opacity:0;
transform:translateY(10px);
}

to{
opacity:1;
transform:none;
}

}


.title{

font-size:22px;

font-weight:900;

margin-bottom:18px;

color:white;

}


/* CASE GRID */

.case-grid{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:14px;

}



.case{

background:
linear-gradient(
160deg,
#151d31,
#0d1423
);


border:

1px solid rgba(255,255,255,.08);


border-radius:22px;


padding:15px;


text-align:center;


position:relative;


overflow:hidden;


transition:.2s;


}



.case:active{

transform:scale(.95);

}



.case::before{

content:"";

position:absolute;

inset:0;

background:
linear-gradient(
120deg,
transparent,
rgba(255,255,255,.08),
transparent
);

transform:translateX(-100%);

}



.case:hover::before{

transform:translateX(100%);

transition:.7s;

}


.case-img{

font-size:55px;

height:80px;

display:flex;

align-items:center;

justify-content:center;

filter:
drop-shadow(0 0 15px #00a8ff);

}


.case-name{

font-size:14px;

font-weight:900;

margin-top:10px;

}


.case-price{

color:var(--gold);

font-weight:900;

margin:8px;


}


.open-btn{

width:100%;

border:0;

padding:12px;

border-radius:14px;

background:

linear-gradient(
135deg,
#ffd700,
#ff9d00
);


font-weight:900;

}


/* NAV */


.nav{

position:fixed;

bottom:0;

left:0;

right:0;


height:70px;


background:

rgba(10,15,30,.95);


backdrop-filter:blur(15px);


display:flex;

justify-content:space-around;

align-items:center;


border-top:

1px solid rgba(255,255,255,.08);


}



.nav button{

background:none;

border:0;

color:#788399;

font-size:12px;

font-weight:800;

}


.nav button.active{

color:var(--gold);

}


/* INVENTORY */


.inventory{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:10px;

}



.item{

background:
var(--card);

border-radius:16px;

padding:10px;

text-align:center;

border:
1px solid rgba(255,255,255,.08);

}



.item span{

font-size:35px;

}


/* PROFILE */


.profile{

background:
var(--card);

border-radius:22px;

padding:25px;

text-align:center;

}


.avatar{

font-size:60px;

}


/* MODAL */


.overlay{

position:fixed;

inset:0;

background:
rgba(0,0,0,.85);

display:none;

align-items:center;

justify-content:center;

z-index:100;


}


.modal{

width:90%;

max-width:360px;


background:
#111827;


border-radius:28px;


padding:25px;


text-align:center;


border:
1px solid rgba(255,215,0,.5);


}


.reward{

font-size:80px;

animation:
pulse 1s infinite;

}


@keyframes pulse{

50%{
transform:scale(1.15);
}

}



.claim{

margin-top:20px;

width:100%;

padding:14px;

border:0;

border-radius:15px;


background:
linear-gradient(135deg,#00a8ff,#006eff);


color:white;

font-weight:900;

}


</style>
</head>


<body>


<header>

<div class="logo">
CASEUP
</div>


<div class="balance">
⭐ <span id="balance">15450</span>
</div>


</header><main>


<!-- КЕЙСЫ -->

<section id="cases" class="page active">

<div class="title">
🎁 Все кейсы
</div>


<div class="case-grid" id="caseGrid"></div>


</section>



<!-- МИНИ ИГРЫ -->

<section id="games" class="page">


<div class="title">
🎮 Мини-игры
</div>



<div class="case-grid">


<div class="case">

<div class="case-img">
🎡
</div>

<div class="case-name">
Колесо удачи
</div>

<div class="case-price">
⭐ Бесплатно
</div>

<button class="open-btn"
onclick="wheelGame()">
Играть
</button>

</div>




<div class="case">

<div class="case-img">
💣
</div>

<div class="case-name">
Mines
</div>

<div class="case-price">
⭐ Ставка
</div>

<button class="open-btn"
onclick="minesGame()">
Играть
</button>

</div>





<div class="case">

<div class="case-img">
🚀
</div>

<div class="case-name">
Crash
</div>

<div class="case-price">
x2 - x100
</div>

<button class="open-btn"
onclick="crashGame()">
Играть
</button>

</div>




<div class="case">

<div class="case-img">
🎯
</div>

<div class="case-name">
Бонус дня
</div>

<div class="case-price">
⭐ +100
</div>

<button class="open-btn"
onclick="bonus()">
Забрать
</button>

</div>


</div>


</section>





<!-- ИНВЕНТАРЬ -->


<section id="inventory" class="page">


<div class="title">
🎒 Инвентарь
</div>


<div class="inventory"
id="inventory">

</div>


</section>





<!-- ПРОФИЛЬ -->


<section id="profile" class="page">


<div class="title">
👤 Профиль
</div>


<div class="profile">


<div class="avatar">
👤
</div>


<h2>
Игрок CaseUp
</h2>


<br>


<p>
Открыто кейсов:
<b id="opened">
0
</b>
</p>


<br>


<p>
Предметов:
<b id="items">
0
</b>
</p>


</div>



</section>


</main>





<!-- НАВИГАЦИЯ -->


<div class="nav">


<button class="active"
onclick="tab('cases',this)">
🎁
<br>
Кейсы
</button>



<button
onclick="tab('games',this)">
🎮
<br>
Игры
</button>




<button
onclick="tab('inventory',this)">
🎒
<br>
Инвентарь
</button>



<button
onclick="tab('profile',this)">
👤
<br>
Профиль
</button>


</div>





<!-- ОКНО ОТКРЫТИЯ -->


<div class="overlay"
id="overlay">


<div class="modal">


<h2>
ВЫИГРЫШ!
</h2>


<div class="reward"
id="reward">
🎁
</div>



<h3 id="rewardName">
</h3>


<p id="rewardRarity">
</p>



<button class="claim"
onclick="claim()">

Забрать в инвентарь

</button>


</div>


</div>





<script>


let balance = 15450;


let inventory =
JSON.parse(
localStorage.getItem("inventory")
)
||
[];



let currentReward=null;


let opened=0;



const cases=[


{
name:"Star Case",
price:50,
icon:"⭐"
},


{
name:"Moon Case",
price:100,
icon:"🌙"
},


{
name:"Sun Case",
price:150,
icon:"☀️"
},


{
name:"Neon Case",
price:200,
icon:"⚡"
},


{
name:"Gold Case",
price:300,
icon:"🪙"
},


{
name:"Diamond Case",
price:500,
icon:"💎"
},


{
name:"Ruby Case",
price:750,
icon:"🔴"
},


{
name:"Sapphire Case",
price:1000,
icon:"🔵"
},


{
name:"Emerald Case",
price:1250,
icon:"🟢"
},


{
name:"Cyber Case",
price:1500,
icon:"🤖"
},


{
name:"Matrix Case",
price:2000,
icon:"🧬"
},


{
name:"Galaxy Case",
price:2500,
icon:"🌌"
},


{
name:"Royal Case",
price:3000,
icon:"👑"
},


{
name:"Titan Case",
price:4000,
icon:"🛡️"
},


{
name:"God Case",
price:5000,
icon:"🔥"
},


{
name:"VIP Case",
price:10000,
icon:"💠"
}


];





const rewards=[


{
name:"Telegram Gift",
icon:"🎁",
rarity:"Common"
},


{
name:"Golden Star",
icon:"⭐",
rarity:"Rare"
},


{
name:"Diamond Ring",
icon:"💍",
rarity:"Epic"
},


{
name:"Golden Crown",
icon:"👑",
rarity:"Legendary"
},


{
name:"Rocket",
icon:"🚀",
rarity:"Mythic"
},


{
name:"Premium NFT",
icon:"💎",
rarity:"Legendary"
}



];





const grid=document.getElementById(
"caseGrid"
);



cases.forEach((c,index)=>{


grid.innerHTML+=`

<div class="case">


<div class="case-img">
${c.icon}
</div>


<div class="case-name">
${c.name}
</div>


<div class="case-price">
⭐ ${c.price}
</div>


<button class="open-btn"
onclick="openCase(${index})">

ОТКРЫТЬ

</button>


</div>


`;


});




document.getElementById(
"balance"
).innerHTML=balance;




function tab(id,btn){


document
.querySelectorAll(".page")
.forEach(
p=>p.classList.remove("active")
);



document
.getElementById(id)
.classList.add("active");



document
.querySelectorAll(".nav button")
.forEach(
b=>b.classList.remove("active")
);



btn.classList.add("active");


}


// ОТКРЫТИЕ КЕЙСА


function openCase(id){


let box=cases[id];



if(balance < box.price){

alert(
"Недостаточно ⭐"
);

return;

}



balance-=box.price;


document.getElementById(
"balance"
).innerText=balance;



opened++;


let random=
Math.random();



if(random < 0.55){

currentReward=rewards[0];

}

else if(random < 0.8){

currentReward=rewards[1];

}

else if(random < 0.93){

currentReward=rewards[2];

}

else if(random < 0.98){

currentReward=rewards[3];

}

else{

currentReward=rewards[5];

}





document.getElementById(
"overlay"
).style.display="flex";



document.getElementById(
"reward"
).innerText="🎲";

document.getElementById(
"rewardName"
).innerText=
"Открываем...";

document.getElementById(
"rewardRarity"
).innerText="";





setTimeout(()=>{


document.getElementById(
"reward"
).innerText=
currentReward.icon;


document.getElementById(
"rewardName"
).innerText=
currentReward.name;


document.getElementById(
"rewardRarity"
).innerText=
currentReward.rarity;



},2000);



updateProfile();


}




// ЗАБРАТЬ ПРИЗ


function claim(){


if(currentReward){


inventory.push(
currentReward
);



localStorage.setItem(
"inventory",
JSON.stringify(inventory)
);



renderInventory();


}



document.getElementById(
"overlay"
).style.display="none";


}





// ИНВЕНТАРЬ


function renderInventory(){


let box=document.getElementById(
"inventory"
);



box.innerHTML="";



if(inventory.length===0){


box.innerHTML=
`
<div style="
grid-column:1/4;
text-align:center;
color:#8892a6;
padding:30px">
Пока пусто 🎁
</div>
`;

return;


}





inventory.forEach(item=>{


box.innerHTML+=`

<div class="item">

<span>
${item.icon}
</span>

<br>

<b>
${item.name}
</b>


<br>

<small>
${item.rarity}
</small>


</div>

`;



});



document.getElementById(
"items"
).innerText=
inventory.length;



}





// ПРОФИЛЬ


function updateProfile(){


document.getElementById(
"opened"
).innerText=
opened;


}




renderInventory();





// TELEGRAM WEB APP


if(window.Telegram){


Telegram.WebApp.ready();


Telegram.WebApp.expand();


}





// ------------------
// МИНИ ИГРЫ
// ------------------




function wheelGame(){


let win =
Math.floor(
Math.random()*200
)+50;



balance+=win;



document.getElementById(
"balance"
).innerText=
balance;


alert(
"🎡 Вы выиграли ⭐"+win
);


}




function minesGame(){


let win =
Math.random()>0.5;


if(win){


balance+=100;


alert(
"💎 Вы нашли ⭐100"
);



}

else{


alert(
"💥 Мина! Попробуйте ещё"
);


}



document.getElementById(
"balance"
).innerText=
balance;


}





function crashGame(){


let multiplier =
(
Math.random()*5+1
)
.toFixed(2);



let win =
Math.floor(
100*multiplier
);



balance+=win;


document.getElementById(
"balance"
).innerText=
balance;


alert(
"🚀 Crash x"+multiplier+
"\nВы получили ⭐"+win
);



}





function bonus(){


let today=
localStorage.getItem(
"bonus"
);



if(today){


alert(
"Бонус уже забран"
);


return;

}



balance+=100;


localStorage.setItem(
"bonus",
"yes"
);



document.getElementById(
"balance"
).innerText=
balance;


alert(
"🎁 +100 ⭐"
);


}



</script>


</body>
</html>
