<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CaseUp</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151922;
            --card-border: #222836;
            --accent-gold: #ffd700;
            --accent-blue: #00c8ff;
            --text-main: #ffffff;
            --text-sec: #8a96a3;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 80px; }

        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(21, 25, 34, 0.95); border-bottom: 1px solid var(--card-border); position: sticky; top: 0; z-index: 50; backdrop-filter: blur(10px); }
        .logo { font-weight: 900; font-size: 20px; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 1px; }
        .balance { background: #1f2633; padding: 6px 14px; border-radius: 20px; font-size: 15px; color: var(--accent-gold); font-weight: 800; border: 1px solid rgba(255,215,0,0.2); display: flex; align-items: center; gap: 6px; }

        .page { display: none; padding: 20px; }
        .page.active { display: block; }
        .title { font-size: 20px; margin-bottom: 15px; color: var(--accent-gold); text-transform: uppercase; font-weight: 900; letter-spacing: 0.5px; }

        .grid-16 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .case-box { background: var(--card-bg); border-radius: 16px; padding: 15px; text-align: center; border: 1px solid var(--card-border); cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; transition: 0.2s; }
        .case-box:active { transform: scale(0.96); border-color: var(--accent-gold); }
        .case-title { font-weight: 700; font-size: 13px; margin: 8px 0 4px 0; color: var(--text-main); }
        .case-cost { font-size: 13px; color: var(--accent-gold); margin-bottom: 10px; font-weight: 800; }
        .btn-open { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #000; border: none; padding: 9px; border-radius: 10px; font-weight: 900; width: 100%; cursor: pointer; text-transform: uppercase; font-size: 11px; }

        .nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(21, 25, 34, 0.95); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid var(--card-border); z-index: 100; backdrop-filter: blur(10px); }
        .nav-btn { background: none; border: none; color: var(--text-sec); font-size: 11px; font-weight: 700; display: flex; flex-direction: column; align-items: center; cursor: pointer; gap: 4px; }
        .nav-btn.active { color: var(--accent-gold); }
        .nav-btn svg { width: 22px; height: 22px; fill: currentColor; }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 200; flex-direction: column; padding: 20px; backdrop-filter: blur(5px); }
        .modal { background: var(--card-bg); border-radius: 20px; padding: 25px; text-align: center; border: 2px solid var(--accent-gold); width: 100%; max-width: 320px; display: none; flex-direction: column; align-items: center; box-shadow: 0 0 30px rgba(255,215,0,0.3); }
        .btn-action { background: linear-gradient(135deg, var(--accent-blue), #0088ff); color: #fff; border: none; padding: 12px; border-radius: 12px; font-weight: 900; width: 100%; cursor: pointer; margin-top: 20px; text-transform: uppercase; font-size: 13px; }

        .inv-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .inv-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 10px; text-align: center; font-size: 11px; }
        .profile-box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 20px; text-align: center; }
    </style>
</head>
<body>

<header>
    <div class="logo">CaseUp</div>
    <div class="balance">⭐ <span id="userBal">15450</span></div>
</header>

<div id="tab-cases" class="page active">
    <div class="title">Все кейсы</div>
    <div class="grid-16" id="casesContainer"></div>
</div>

<div id="tab-inventory" class="page">
    <div class="title">Инвентарь</div>
    <div class="inv-grid" id="inventoryContainer">
        <div style="grid-column: span 3; text-align: center; color: var(--text-sec); padding: 40px 0;">Инвентарь пуст</div>
    </div>
</div>

<div id="tab-profile" class="page">
    <div class="title">Профиль</div>
    <div class="profile-box">
        <div style="font-size: 45px; margin-bottom: 10px;">👤</div>
        <div style="font-weight: bold; font-size: 16px; margin-bottom: 4px;">Игрок CaseUp</div>
        <div style="color: var(--text-sec); font-size: 12px; margin-bottom: 15px;">ID: 77819234</div>
        <button class="btn-open" style="background: #222836; color: var(--accent-gold); border: 1px solid var(--accent-gold);">Реферальная система</button>
    </div>
</div>

<div class="nav">
    <button class="nav-btn active" onclick="changeTab('cases', this)">
        <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM10 4h4v2h-4V4zm10 15H4V8h16v11z"/></svg>
        Кейсы
    </button>
    <button class="nav-btn" onclick="changeTab('inventory', this)">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4 5h2v5h-2z"/></svg>
        Инвентарь
    </button>
    <button class="nav-btn" onclick="changeTab('profile', this)">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        Профиль
    </button>
</div>

<div class="overlay" id="loaderOverlay">
    <div style="font-size: 50px; animation: spin 1s infinite linear;">🎁</div>
    <div style="color: var(--accent-gold); margin-top: 15px; font-weight: bold; font-size: 15px;">Открываем кейс...</div>
</div>

<div class="overlay" id="dropOverlay">
    <div class="modal" id="dropModal">
        <h3 style="color: var(--accent-gold); margin-bottom: 8px; font-size: 17px;">ВЫИГРЫШ!</h3>
        <div id="dropIcon" style="font-size: 60px; margin: 10px 0;"></div>
        <div id="dropName" style="font-size: 17px; font-weight: bold; margin-bottom: 4px;"></div>
        <div id="dropRarity" style="color: var(--accent-blue); font-size: 12px; margin-bottom: 15px; text-transform: uppercase; font-weight: bold;"></div>
        <button class="btn-action" onclick="claimPrize()">Забрать в инвентарь</button>
    </div>
</div>

<script>
    let balance = 15450;
    let myInventory = [];
    let currentWonItem = null;

    const allCases = [
        { name: 'Star Case', price: 50, icon: '⭐' },
        { name: 'Moon Case', price: 100, icon: '🌙' },
        { name: 'Sun Case', price: 150, icon: '☀️' },
        { name: 'Neon Case', price: 200, icon: '⚡' },
        { name: 'Gold Case', price: 300, icon: '🪙' },
        { name: 'Diamond Case', price: 500, icon: '💎' },
        { name: 'Ruby Case', price: 750, icon: '🔴' },
        { name: 'Sapphire Case', price: 1000, icon: '🔵' },
        { name: 'Emerald Case', price: 1250, icon: '🟢' },
        { name: 'Cyber Case', price: 1500, icon: '🤖' },
        { name: 'Matrix Case', price: 2000, icon: '🧬' },
        { name: 'Galaxy Case', price: 2500, icon: '🌌' },
        { name: 'Royal Case', price: 3000, icon: '👑' },
        { name: 'Titan Case', price: 4000, icon: '🛡️' },
        { name: 'God Case', price: 5000, icon: '⚡' },
        { name: 'CaseUp VIP', price: 10000, icon: '🔥' }
    ];

    const rewardsPool = [
        { name: 'Diamond Ring', rarity: 'Legendary NFT', icon: '💍' },
        { name: 'Gold Crown', rarity: 'Epic NFT', icon: '👑' },
        { name: 'Telegram Star', rarity: 'Rare Token', icon: '⭐' },
        { name: 'Teddy Bear', rarity: 'Common Gift', icon: '🧸' },
        { name: 'Party Popper', rarity: 'Rare Gift', icon: '🎉' },
        { name: 'Green Heart', rarity: 'Epic NFT', icon: '💚' }
    ];

    const container = document.getElementById('casesContainer');
    allCases.forEach(item => {
        container.innerHTML += `
            <div class="case-box" onclick="openCase(${item.price})">
                <div style="font-size: 38px; margin: 8px 0;">${item.icon}</div>
                <div>
                    <div class="case-title">${item.name}</div>
                    <div class="case-cost">⭐ ${item.price}</div>
                </div>
                <button class="btn-open">Открыть</button>
            </div>
        `;
    });

    function changeTab(tabId, btn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + tabId).classList.add('active');
        btn.classList.add('active');
    }

    function openCase(price) {
        if (balance < price) {
            alert('Недостаточно звезд!');
            return;
        }
        balance -= price;
        document.getElementById('userBal').innerText = balance.toLocaleString();
        
        document.getElementById('loaderOverlay').style.display = 'flex';

        setTimeout(() => {
            document.getElementById('loaderOverlay').style.display = 'none';
            currentWonItem = rewardsPool[Math.floor(Math.random() * rewardsPool.length)];
            
            document.getElementById('dropIcon').innerText = currentWonItem.icon;
            document.getElementById('dropName').innerText = currentWonItem.name;
            document.getElementById('dropRarity').innerText = currentWonItem.rarity;

            document.getElementById('dropOverlay').style.display = 'flex';
            document.getElementById('dropModal').style.display = 'flex';
        }, 1200);
    }

    function claimPrize() {
        if (currentWonItem) {
            myInventory.push(currentWonItem);
            renderInventory();
        }
        document.getElementById('dropOverlay').style.display = 'none';
        document.getElementById('dropModal').style.display = 'none';
    }

    function renderInventory() {
        const inv = document.getElementById('inventoryContainer');
        inv.innerHTML = '';
        myInventory.forEach(el => {
            inv.innerHTML += `
                <div class="inv-card">
                    <div style="font-size: 28px; margin-bottom: 4px;">${el.icon}</div>
                    <div style="font-weight: bold; font-size: 10px;">${el.name}</div>
                </div>
            `;
        });
    }
</script>
<style>
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</body>
</html>
